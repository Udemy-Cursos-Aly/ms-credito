spring.application.name=credito

server.port=8082

# Conexão e configuração do RabbitMQ da nossa aplicação
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Nome da fila que vamos consumir as mensagens
rabbit.mq.queue.pp.ms.credito=proposta-pendente.ms-analise-credito

# Nome da exchange de propostas concluidas
rabbit.mq.pc.exchange=proposta-concluida.ex
